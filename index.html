<!DOCTYPE html>
<html lang="en">

<head>
    <meta http-equiv="content-type" content="text/html; charset=utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="robots" content="noindex">
    <title>Akshat's Resume</title>
    <style>
        :root {
            color-scheme: light dark;
        }

        body {
            min-height: 100vh;
            margin: 0;
            color: CanvasText;
            background: Canvas;
            font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        }

        .resume-page {
            display: grid;
            grid-template-rows: auto 1fr;
            min-height: 100vh;
        }

        .resume-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 1rem;
            padding: 1rem 1.5rem;
            border-bottom: 1px solid ButtonBorder;
        }

        h1,
        p {
            margin: 0;
        }

        h1 {
            font-size: 1.25rem;
            font-weight: 700;
        }

        .resume-label {
            margin-top: 0.25rem;
            color: GrayText;
            font-size: 0.875rem;
        }

        .resume-actions {
            display: flex;
            flex-wrap: wrap;
            gap: 0.75rem;
        }

        .resume-actions a {
            color: CanvasText;
            border: 1px solid ButtonBorder;
            border-radius: 0.25rem;
            padding: 0.45rem 0.7rem;
            font-size: 0.875rem;
            font-weight: 600;
            text-decoration: none;
        }

        .resume-actions a:hover {
            background: ButtonFace;
        }

        .resume-actions a:focus-visible {
            outline: 2px solid Highlight;
            outline-offset: 2px;
        }

        .resume-preview {
            min-height: 0;
            overflow: auto;
            background: #e8e8e8;
        }

        .resume-viewer {
            display: block;
            width: 100%;
            height: 100%;
            min-height: calc(100vh - 5.5rem);
            border: 0;
        }

        .resume-image-link {
            display: none;
            box-sizing: border-box;
            width: 100%;
            max-width: 52rem;
            margin: 0 auto;
            padding: 1rem;
        }

        .resume-image {
            display: block;
            width: 100%;
            height: auto;
            border-radius: 0.25rem;
            box-shadow: 0 0.25rem 1rem rgb(0 0 0 / 0.12);
            background: #fff;
        }

        @media (max-width: 640px) {
            .resume-header {
                align-items: flex-start;
                flex-direction: column;
            }

            /* Mobile browsers often cannot render PDFs inside iframes. */
            .resume-viewer {
                display: none;
            }

            .resume-image-link {
                display: block;
            }
        }

        @media (prefers-color-scheme: dark) {
            .resume-preview {
                background: #1c1c1e;
            }
        }

        @media print {
            .resume-header {
                display: none;
            }

            .resume-viewer {
                display: none;
            }

            .resume-image-link {
                display: block;
                max-width: none;
                padding: 0;
            }

            .resume-image {
                box-shadow: none;
                border-radius: 0;
            }
        }
    </style>
</head>

<body>
    <main class="resume-page">
        <header class="resume-header">
            <div>
                <h1>Akshat Aggarwal</h1>
                <p class="resume-label">Resume</p>
            </div>
            <nav class="resume-actions" aria-label="Resume actions">
                <a href="resume.pdf" download>Download PDF</a>
            </nav>
        </header>
        <section class="resume-preview" aria-label="Resume preview">
            <iframe class="resume-viewer" src="resume.pdf" title="Akshat Aggarwal resume PDF"></iframe>
            <a class="resume-image-link" href="resume.pdf">
                <img class="resume-image" src="img/resume.png" width="1241" height="1754" alt="Akshat Aggarwal resume preview. Tap to open the PDF.">
            </a>
        </section>
    </main>
</body>

</html>
